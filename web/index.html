<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dividing Lines: what separates Luminal A from Luminal B breast tumours. A gene-expression study of 59 tumours from GEO GSE45827." />
    <meta name="color-scheme" content="light dark" />
    <title>Dividing Lines</title>
    <script>
      // Apply the saved imaging mode before first paint so there is no flash.
      try {
        var m = localStorage.getItem('dl.mode');
        if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
